[project]
name = "agent-desk"
version = "0.1.0"
description = "No-code personal agent web app for a locked-down corporate Windows laptop"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44",
    "keyring>=25",
]

[tool.agent-desk-licenses]
cryptography = "Apache-2.0 OR BSD-3-Clause"
keyring = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
