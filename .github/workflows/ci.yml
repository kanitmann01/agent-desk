name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pytest is a dev tool, not a project dependency: the repo is
      # stdlib-only and the suite runs straight from the checkout.
      - name: Install the test runner
        run: python -m pip install pytest

      - name: Run the suite
        run: python -m pytest

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install from the lockfile
        run: npm ci

      - name: Strict typecheck
        run: npm run check

  licenses:
    name: License manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The declared floor, so the gate exercises the tool's
          # stdlib TOML fallback on every push.
          python-version: "3.10"

      - name: Generate and gate the manifest
        run: python tools/license_manifest.py

      - name: The committed manifest is current
        run: git diff --exit-code THIRD-PARTY-LICENSES.md
